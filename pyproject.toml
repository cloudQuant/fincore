[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fincore"
version = "0.5.0.dev0"
description = "Quantitative performance and risk analytics for Python"
readme = "README.md"
license = "MIT"
# ``LICENSE`` is the sole Fincore project license.  The remaining files are
# third-party terms/attribution shipped to satisfy their independent licenses;
# they do not relicense Fincore as Apache-2.0.
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES/Apache-2.0.txt"]
requires-python = ">=3.11"
authors = [
    {name = "cloudQuant", email = "yunjinqi@gmail.com"},
]
classifiers = [
    # 0.5 is a breaking, pre-release unified-core migration.
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.3",
    "scipy>=1.9.3",
    "pytz>=2023.3",
    "packaging>=21.0",
]

[project.optional-dependencies]
# Functional extras — one per installable capability. These lists are the
# only runtime dependency metadata; no legacy package/profile alias remains.
factor-analysis = ["statsmodels>=0.14"]
visualization = ["matplotlib>=3.3", "seaborn>=0.11", "ipython>=7", "plotly>=5", "bokeh>=3"]
interactive = ["plotly>=5", "bokeh>=3"]
report-pdf = ["playwright>=1.40", "PyPDF2>=3"]
report-xlsx = ["openpyxl>=3"]
bayesian = ["pymc>=5"]
data-yahoo = ["yfinance>=0.2"]
data-alphavantage = ["requests>=2.31"]
data-pandas-datareader = ["pandas-datareader>=0.8"]
data-cn = ["tushare>=1", "akshare>=1"]

# Preserve the existing contributor installation contract.
# setuptools/wheel mirror [build-system].requires so in-place `pip wheel
# --no-build-isolation` works from a dev install (pip >= 26 no longer
# guarantees setuptools in fresh environments).
dev = [
  "pytest>=6", "pytest-xdist>=2", "pytest-cov>=2.10",
  "pytest-benchmark>=3.2", "pytest-sugar>=0.9", "parameterized>=0.7",
  "hypothesis>=6.100",
  "PyYAML>=6.0",
  "ruff>=0.4", "mypy>=1.5", "types-requests>=2.25",
  "yfinance>=0.2", "requests>=2.25",
  "statsmodels>=0.14", "matplotlib>=3.3", "seaborn>=0.11", "ipython>=7", "PyPDF2>=3",
  "bokeh>=3", "plotly>=5", "playwright>=1.40", "openpyxl>=3",
  "pre-commit>=3", "bandit[toml]>=1.7",
  "setuptools>=68.0", "wheel", "build>=1.2",
]

# Exact normalized union of functional extras above; excludes dev.
all = [
  "statsmodels>=0.14", "matplotlib>=3.3", "seaborn>=0.11", "ipython>=7",
  "plotly>=5", "bokeh>=3", "playwright>=1.40", "PyPDF2>=3",
  "openpyxl>=3", "pymc>=5", "yfinance>=0.2", "requests>=2.31",
  "pandas-datareader>=0.8", "tushare>=1", "akshare>=1",
]

[project.urls]
Homepage = "https://github.com/cloudQuant/fincore"
Documentation = "https://github.com/cloudQuant/fincore#readme"
Repository = "https://github.com/cloudQuant/fincore"
Issues = "https://github.com/cloudQuant/fincore/issues"
Changelog = "https://github.com/cloudQuant/fincore/blob/master/CHANGELOG.md"

[tool.setuptools.package-data]
fincore = ["py.typed", "report/assets/*.js"]

[tool.setuptools.packages.find]
include = ["fincore*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short -q -ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "integration_offline: integration tests that run without network access (release-gate selector)",
    "integration_online: integration tests that require network access (never run in the release gate)",
    "unit: marks tests as unit tests",
    "serial: marks tests that must run without -n (flaky under pytest-xdist)",
    "property: marks hypothesis property tests (bounded examples, deterministic seed)",
    "p0: marks tests as critical priority (core metrics, revenue-critical, security, compliance)",
    "p1: marks tests as high priority (frequently used features, important edge cases)",
    "p2: marks tests as medium priority (secondary features, admin functions)",
    "p3: marks tests as low priority (rarely used, cosmetic)",
]
norecursedirs = [".git", ".tox", "dist", "build", "*.egg", "__pycache__"]
filterwarnings = [
    "error::RuntimeWarning",
    # Edge case tests: empty/NaN data triggers numpy warnings (expected).
    "ignore:Mean of empty slice:RuntimeWarning",
    "ignore:invalid value encountered in reduce:RuntimeWarning",
    # Third-party noise (not actionable for this project).
    "ignore::UserWarning:matplotlib\\.dates",
    "ignore::PendingDeprecationWarning:seaborn\\.categorical",
    "ignore::DeprecationWarning:PyPDF2",
    "ignore:This axis already has a converter:UserWarning",
    "ignore:Legend does not support handles:UserWarning",
    "ignore:PeriodDtype\\[B\\] is deprecated:FutureWarning",
]

[tool.coverage.run]
source = ["fincore"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/deprecate.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    # Defensive unreachable code
    "if \\(len\\(returns\\) == 0\\) or \\(len\\(underwater\\) == 0\\):",
    "if len\\(years\\) < 1:",
    "if len\\(max_dds\\) == 0:",
    # hurst_exponent edge cases
    "if n_subseries < 1:",
    "return np.nan # hurst fallback line 193",
    "if len\\(lags_array\\) < 2:",
    # Abstract methods
    "pass$",
    # Standard pragma
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstract",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# Staged typing policy: numerical risk kernels and report renderers widen their
# annotation coverage independently while preserving the canonical boundaries.
[[tool.mypy.overrides]]
module = [
    "fincore.risk.evt",
    "fincore.risk.garch",
    "fincore.report.*",
]
check_untyped_defs = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "PIE790", "C4", "PTH", "PERF", "RUF", "ERA", "D100", "D104", "S110", "S113", "RET", "TCH", "LOG", "G", "PGH"]
ignore = [
    "C408",   # dict() literal (plotly API prefers dict(); defer to avoid large refactor)
    "E402",   # module-level import not at top of file (intentional in this codebase)
    "E501",   # line too long (handled by ruff format)
    "F401",   # unused import (many are dynamically accessed via __getattr__ / registry)
    "UP007",  # use X | Y for union types
    "UP031",  # use format specifiers instead of percent format
    "UP035",  # import from typing (kept for clarity)
    "B007",   # unused loop variable
    "B023",   # function definition does not bind loop variable
    "B028",   # no explicit stacklevel keyword argument
    "SIM113", # use enumerate for index variable
    "RUF001", # ambiguous unicode in strings (Chinese examples use fullwidth punctuation intentionally)
    "RUF002", # ambiguous unicode in docstrings (Chinese + math notation)
    "RUF003", # ambiguous unicode in comments (Chinese)
    "RUF012", # mutable class attrs (test fixtures)
    "RUF043", # pytest match= raw string (many test files)
]

[tool.ruff.lint.per-file-ignores]
# Examples/tests often have commented config snippets and doc blocks
"examples/**" = ["ERA001"]
"tests/**" = ["ERA001", "D100", "D104"]
"benchmarks/**" = ["ERA001"]
"scripts/**" = ["D100", "BLE001"]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "benchmarks"]
exclude = ["*/test_*.py", "*/tests/*"]
skips = ["B101"]  # assert_used: intentional for type narrowing in fincore
