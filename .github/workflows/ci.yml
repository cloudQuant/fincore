name: CI

on:
  push:
    branches: [master, main]
    tags: ["*"]
  pull_request:
    branches: [master, main]
  # 0042-R2 technical matrix is deliberately manual.  It requires an
  # independently retained D0 bundle and frozen tooling commit; ordinary PR
  # CI must never manufacture either expected input from candidate code.
  workflow_dispatch:
    inputs:
      d0_bundle_url:
        description: HTTPS URL for the immutable ZIP whose root contains d0-bundle-manifest.json
        required: true
        type: string
      d0_bundle_sha256:
        description: SHA256 of the immutable D0 bundle ZIP
        required: true
        type: string
      tooling_ref:
        description: Frozen 0042-R2 acceptance tooling commit available in this repository
        default: 1d2371a3937250560aa85681992b3ee9efb2ce54
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform matrix: fast suite + serial suite, full failure evidence.
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt

      - name: Run fast suite (parallel)
        run: |
          pytest tests/ -q --tb=short --maxfail=0 -m "not slow and not integration and not serial" --ignore=tests/benchmarks/ -n auto

      - name: Run serial suite
        run: |
          pytest tests/ -q --tb=short --maxfail=0 -m "serial and not slow and not integration" --ignore=tests/benchmarks/ -n 0

  # Comparable non-serial runs: single-process vs xdist, JUnit-verified.
  non-serial-single:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt

      - name: Run non-serial suite (single process)
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not serial and not slow and not integration" --ignore=tests/benchmarks \
            --junitxml=non-serial-single.xml

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-non-serial-single
          path: non-serial-single.xml

  non-serial-parallel:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt

      - name: Run non-serial suite (xdist)
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not serial and not slow and not integration" --ignore=tests/benchmarks \
            --junitxml=non-serial-parallel.xml -n auto --dist=loadscope

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-non-serial-parallel
          path: non-serial-parallel.xml

  compare-nonserial:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [non-serial-single, non-serial-parallel]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download JUnit reports
        uses: actions/download-artifact@v4
        with:
          path: junit-reports
          merge-multiple: true

      - name: Compare single-process and xdist JUnit reports
        run: |
          python scripts/audit_test_markers.py --compare-junit \
            junit-reports/non-serial-single.xml junit-reports/non-serial-parallel.xml

  integration-offline:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt

      - name: Run offline integration suite
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 -m integration_offline

  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check fincore/ tests/ scripts/ examples/ benchmarks/ --output-format=github

      - name: Ruff format (check)
        run: ruff format --check fincore/ tests/ scripts/ examples/ benchmarks/

  typecheck:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: mypy (full package)
        run: |
          python -m mypy fincore --ignore-missing-imports

      - name: compileall (syntax check)
        run: |
          python -m compileall -q fincore

  security:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Bandit security scan
        run: bandit -r fincore/ -c pyproject.toml

  marker-audit:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt

      - name: Audit release-gate markers
        run: python scripts/audit_test_markers.py

  # Branch-coverage gate: same selector as the trusted Task 1 baseline
  # (which includes serial tests in a single process) so the comparison is
  # apples-to-apples, plus a changed-line coverage floor of 95%.
  coverage-branch:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt

      - name: Run tests with branch coverage
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not slow and not integration" --ignore=tests/benchmarks \
            --cov=fincore --cov-branch --cov-report=json:coverage.json

      - name: Check coverage against baseline
        run: |
          python scripts/check_coverage_baseline.py \
            --coverage-json coverage.json \
            --baseline docs/quality/current-baseline.json \
            --changed-lines-min 95

      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json

  docs:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[visualization]"
          pip install mkdocs-material "mkdocstrings[python]" mkdocs-gen-files mkdocs-literate-nav

      - name: Build docs (strict)
        run: python -m mkdocs build --strict

  perf:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      # The previous run's results act as the platform-labelled baseline
      # (cache keyed by runner OS/arch).  On a cold cache the comparison
      # still enforces the structural gates (superlinearity, window RSS
      # scaling, round-trip share-amount scaling).
      - name: Restore previous benchmark baseline
        uses: actions/cache@v6
        with:
          path: .benchmarks/
          key: perf-baseline-v2-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            perf-baseline-v2-${{ runner.os }}-${{ runner.arch }}
          save-always: true

      - name: Run rolling benchmarks
        run: |
          mkdir -p .benchmarks
          python scripts/run_rolling_benchmarks.py \
            --sizes 2520 25200 --windows 21 63 252 504 \
            --repeats 3 --output .benchmarks/rolling-candidate.json

      - name: Run round-trip benchmarks
        run: |
          python scripts/run_round_trip_benchmarks.py \
            --amounts 10 10000000 --rows 100 10000 \
            --repeats 3 --output .benchmarks/round-trips-candidate.json

      # Performance regressions fail CI; no continue-on-error.  A missing
      # baseline file only downgrades to the structural gates, which still
      # fail on complexity and memory-scaling regressions.
      - name: Compare rolling benchmarks against baseline
        run: |
          python scripts/compare_benchmarks.py \
            --baseline .benchmarks/rolling-baseline.json \
            --candidate .benchmarks/rolling-candidate.json \
            --max-time-regression 0.25 --max-rss-regression 0.25 \
            --allow-missing-baseline

      - name: Compare round-trip benchmarks against baseline
        run: |
          python scripts/compare_benchmarks.py \
            --baseline .benchmarks/round-trips-baseline.json \
            --candidate .benchmarks/round-trips-candidate.json \
            --max-time-regression 0.25 --max-rss-regression 0.25 \
            --allow-missing-baseline

      - name: Gate benchmark runner schemas
        run: |
          pytest -o addopts='' -q tests/benchmarks/test_rolling_regression.py \
            tests/benchmarks/test_round_trip_scaling.py

      - name: Store candidate as next baseline
        run: |
          cp .benchmarks/rolling-candidate.json .benchmarks/rolling-baseline.json
          cp .benchmarks/round-trips-candidate.json .benchmarks/round-trips-baseline.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: .benchmarks/

  # Deliberately separate from the fast/xdist test matrix: these real enhanced
  # factor-analysis artifacts measure process RSS in fresh subprocesses.
  factor-benchmark-artifacts:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Gate factor benchmark contracts (single process)
        run: |
          python -m pytest -o addopts='' -q \
            tests/benchmarks/test_factor_analysis_performance.py

      - name: Run sparse event benchmark artifact
        run: |
          mkdir -p .factor-benchmarks
          python scripts/run_factor_benchmarks.py \
            --scenarios event --warmups 1 --repeats 1 \
            --output .factor-benchmarks/factor-event.json

      - name: Run medium factor benchmark artifact
        run: |
          python scripts/run_factor_benchmarks.py \
            --scenarios medium-artifact --warmups 0 --repeats 1 \
            --output .factor-benchmarks/factor-medium.json

      - name: Upload factor benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-benchmark-artifacts
          path: .factor-benchmarks/

  # Release build gate: depends on every blocking job, not only tests.
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      [test, non-serial-single, non-serial-parallel, compare-nonserial,
       integration-offline, lint, typecheck, security, marker-audit,
       coverage-branch, docs, perf, factor-benchmark-artifacts,
       quality-snapshot-freshness, optional-extra-smoke, property-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install build tools
        run: |
          pip install build twine pytest
          # Runtime deps for the packaging contract tests (they import the
          # checkout and run core-only consumer subprocesses).
          pip install -e .

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Verify release consistency
        run: python scripts/check_release_consistency.py --dist dist/

      - name: Compute release manifest (SHA256)
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib
          artifacts = {}
          for p in pathlib.Path("dist").glob("*"):
              if p.is_file() and not p.name.endswith(".json"):
                  artifacts[p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path("dist/release-manifest.json").write_text(
              json.dumps({"artifacts": artifacts}, indent=2)
          )
          EOF

      - name: Verify release candidate digest
        run: python scripts/check_release_candidate.py --dist dist/ --manifest dist/release-manifest.json

      # These are real candidate installs, not a check that two text files
      # contain plausible version strings.  The command logs the versions seen
      # inside each new venv, runs pip check, and imports the installed wheel.
      - name: Verify candidate with oldest-resolvable dependencies
        run: >-
          python scripts/check_dependency_matrix.py
          --wheel "$(find dist -name '*.whl' -print -quit)" --lane minimum

      - name: Verify candidate with newest dependency floors
        run: >-
          python scripts/check_dependency_matrix.py
          --wheel "$(find dist -name '*.whl' -print -quit)" --lane latest

      # Wheel-consumer smoke: pip --target installs the wheel (plus extras)
      # into isolated targets and fresh ``-S -E`` subprocesses assert package
      # provenance and direct canonical-domain smoke. The declared capability
      # profiles are the release gate; no upstream-package profile remains.
      # Playwright browser binaries + real PDF rendering are a separate
      # two-stage job.
      - name: Wheel consumer smoke (Task 9 required profiles)
        run: >-
          python scripts/test_installed_wheel.py --dist dist/
          --profiles core factor-analysis visualization report-pdf report-xlsx bayesian all
          --data-providers all

      - name: Packaging contract tests
        run: pytest -o addopts='' tests/packaging -q --maxfail=0

      # CI verifies that the distribution preserves the complete, pinned
      # third-party notice inventory. ``--require-approved`` remains an
      # optional organization-policy audit and is deliberately not a release
      # prerequisite: CI cannot manufacture a legal approval.
      - name: Check third-party notice inventory
        run: python scripts/check_notices.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Freshness gate for the checked-in quality snapshot.  A release claim can
  # only cite a snapshot that is clean (dirty=false), complete, and above the
  # branch-coverage minimum.  The commit-equality check is skipped here because
  # CI HEAD is the PR/release commit while the snapshot records the commit it
  # was generated from (always an ancestor); the local checker still enforces
  # exact HEAD equality at generation time.
  quality-snapshot-freshness:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [coverage-branch]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check quality snapshot freshness
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            python scripts/check_quality_snapshot.py \
              --snapshot docs/quality/current-baseline.json
          else
            python scripts/check_quality_snapshot.py \
              --snapshot docs/quality/current-baseline.json \
              --skip-commit-check
          fi

  # Clean-environment smoke for the optional data extras.  Installs each extra,
  # imports its SDK in a fresh interpreter, and runs the fake-client provider
  # tests.  It never contacts a market-data service, so a broken native TLS
  # stack on a developer machine cannot block the release gate.
  optional-extra-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install data extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[data-yahoo,data-cn]"

      - name: Import SDKs in a fresh interpreter
        run: |
          python -c "import yfinance, akshare, tushare; print('data SDK import ok')"

      - name: Run fake-client provider tests
        run: |
          pytest -o addopts='' -q \
            tests/test_data/test_optional_dependency_health.py \
            tests/test_attribution/test_provider_contracts.py

  # Property tests run serially (-n 0) so Hypothesis shrinking and the global
  # seed stay reproducible; examples are bounded to keep CI time predictable.
  property-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install -r requirements-test.txt

      - name: Run property and oracle suites (serial)
        run: |
          pytest -o addopts='' tests/property -q --tb=short -n 0

  # This is intentionally distinct from ordinary editable-install CI.  It
  # builds exactly one wheel/sdist pair, hands that immutable artifact to the
  # three OS cells, and consumes the frozen runner/D0 contract.  A missing D0
  # archive, frozen tooling ref, or cell remains a failure/blocker rather than
  # falling back to mutable candidate expectations.
  r2-acceptance-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      candidate_tree: ${{ steps.candidate.outputs.tree }}
      dist_artifact_id: ${{ steps.upload-dist.outputs.artifact-id }}
      dist_manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - name: Checkout the selected R2 candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Set up R2 build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.8"

      - name: Build the one R2 distribution
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install --upgrade pip build twine
          python -m build --outdir ../r2-acceptance-dist
          python -m twine check ../r2-acceptance-dist/*.whl ../r2-acceptance-dist/*.tar.gz
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          from pathlib import Path

          dist = Path("../r2-acceptance-dist")
          artifacts = [*sorted(dist.glob("*.whl")), *sorted(dist.glob("*.tar.gz"))]
          if len(artifacts) != 2:
              raise SystemExit(f"expected one wheel and one sdist, found: {artifacts}")
          manifest = "".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in artifacts
          )
          (dist / "build-artifacts.sha256").write_text(manifest, encoding="utf-8")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Record immutable build identity
        id: candidate
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Record immutable distribution manifest digest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          echo "sha256=$(sha256sum r2-acceptance-dist/build-artifacts.sha256 | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the immutable R2 distribution
        id: upload-dist
        uses: actions/upload-artifact@v4
        with:
          name: r2-acceptance-dist
          path: r2-acceptance-dist
          if-no-files-found: error

  r2-acceptance-matrix-cell:
    if: github.event_name == 'workflow_dispatch'
    needs: r2-acceptance-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            python: "3.11.8"
          - os: macos
            runner: macos-latest
            python: "3.11.8"
          - os: windows
            runner: windows-latest
            python: "3.11.8"
    steps:
      - name: Checkout the exact R2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.r2-acceptance-build.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frozen R2 acceptance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false

      # The frozen runner identifies its immutable Git blobs directly, while
      # clean Windows worktrees may legitimately use CRLF physical bytes.
      - name: Verify frozen tooling checkout on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C tooling status --porcelain=v1 --untracked-files=all)"

      - name: Set up D0-frozen Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download the immutable R2 distribution
        uses: actions/download-artifact@v4
        with:
          name: r2-acceptance-dist
          path: r2-acceptance-dist

      - name: Verify the immutable R2 distribution
        shell: python
        working-directory: r2-acceptance-dist
        run: |
          import hashlib
          from pathlib import Path

          manifest = Path("build-artifacts.sha256")
          expected = {}
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              expected[name.strip()] = digest
          artifacts = [*sorted(Path(".").glob("*.whl")), *sorted(Path(".").glob("*.tar.gz"))]
          if len(artifacts) != 2 or set(expected) != {path.name for path in artifacts}:
              raise SystemExit("the build artifact does not contain exactly one wheel and one sdist")
          for artifact in artifacts:
              if hashlib.sha256(artifact.read_bytes()).hexdigest() != expected[artifact.name]:
                  raise SystemExit(f"distribution digest mismatch: {artifact.name}")

      - name: Materialize the immutable D0 bundle
        shell: python
        env:
          D0_BUNDLE_URL: ${{ inputs.d0_bundle_url }}
          D0_BUNDLE_SHA256: ${{ inputs.d0_bundle_sha256 }}
        run: |
          import hashlib
          import os
          import string
          import urllib.request
          import zipfile
          from pathlib import Path

          expected = os.environ["D0_BUNDLE_SHA256"].lower()
          url = os.environ["D0_BUNDLE_URL"]
          if not url.startswith("https://"):
              raise SystemExit("D0 bundle URL must use HTTPS")
          if len(expected) != 64 or any(char not in string.hexdigits for char in expected):
              raise SystemExit("D0 bundle SHA256 must be a 64-character hexadecimal digest")
          archive = Path("r2-d0-bundle.zip").resolve()
          with urllib.request.urlopen(url, timeout=60) as response, archive.open("wb") as target:
              while chunk := response.read(1024 * 1024):
                  target.write(chunk)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("D0 bundle archive digest mismatch")
          destination = Path("r2-d0").resolve()
          destination.mkdir()
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  target = (destination / member.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"unsafe D0 archive member: {member.filename}")
              bundle.extractall(destination)
          if not (destination / "d0-bundle-manifest.json").is_file():
              raise SystemExit("D0 bundle root must contain d0-bundle-manifest.json")

      - name: Install R2 matrix-cell dependencies
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find "$GITHUB_WORKSPACE/r2-acceptance-dist" -maxdepth 1 -type f -name '*.whl' -print)
          test "$(printf '%s\n' "$wheel" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "$wheel[dev,visualization,report-pdf,report-xlsx,bayesian,data-yahoo,data-alphavantage,data-pandas-datareader,data-cn]"
          python -m pip install -r candidate/requirements-test.txt

      - name: Bind the immutable build artifact to this matrix cell
        shell: python
        env:
          BUILD_ARTIFACT_ID: ${{ needs.r2-acceptance-build.outputs.dist_artifact_id }}
          BUILD_MANIFEST_SHA256: ${{ needs.r2-acceptance-build.outputs.dist_manifest_sha256 }}
          CANDIDATE_SHA: ${{ needs.r2-acceptance-build.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.r2-acceptance-build.outputs.candidate_tree }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          import json
          import os
          from pathlib import Path

          output = Path("r2-matrix-cell") / os.environ["MATRIX_OS"]
          output.mkdir(parents=True)
          (output / "r2-build-handoff.json").write_text(
              json.dumps(
                  {
                      "artifact_id": os.environ["BUILD_ARTIFACT_ID"],
                      "artifact_name": "r2-acceptance-dist",
                      "build_manifest_sha256": os.environ["BUILD_MANIFEST_SHA256"],
                      "candidate_commit": os.environ["CANDIDATE_SHA"],
                      "candidate_tree": os.environ["CANDIDATE_TREE"],
                      "matrix_os": os.environ["MATRIX_OS"],
                      "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
                      "workflow_run_id": os.environ["GITHUB_RUN_ID"],
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

      - name: Run the frozen R2 matrix-cell contract
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.r2-acceptance-build.outputs.candidate_sha }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          wheel=$(find "$GITHUB_WORKSPACE/r2-acceptance-dist" -maxdepth 1 -type f -name '*.whl' -print)
          test "$(printf '%s\n' "$wheel" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          python -I "$GITHUB_WORKSPACE/tooling/scripts/run_0042_r2_acceptance.py" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-head "$CANDIDATE_SHA" \
            --candidate-wheel "$wheel" \
            --expected-bundle "$GITHUB_WORKSPACE/r2-d0" \
            --gate matrix-cell \
            --os "${{ matrix.os }}" \
            --python-full-version "$(python -c 'import platform; print(platform.python_version())')" \
            --dependency-lane latest \
            --dependency-profile all \
            --runner-image "${{ matrix.runner }}" \
            --output-dir "$GITHUB_WORKSPACE/r2-matrix-cell/${{ matrix.os }}"

      # The frozen runner intentionally records command-output digests only.
      # On a failed cell, retain a second, diagnostic-only invocation so the
      # artifact exposes the concrete pytest failure.  This does not alter the
      # frozen contract verdict or any matrix-cell evidence fields.
      - name: Capture failed matrix contract diagnostics
        if: failure()
        shell: bash
        working-directory: candidate
        run: |
          set -uo pipefail
          output="$GITHUB_WORKSPACE/r2-matrix-cell/${{ matrix.os }}"
          diagnostic="$output/matrix-contract-diagnostic.log"
          {
            echo "diagnostic only; it does not alter the frozen contract verdict"
            if [ ! -d "$output/wheel-target" ]; then
              echo "matrix runner did not reach wheel-target creation"
              test -f "$output/evidence.json" && cat "$output/evidence.json"
            else
              export MPLBACKEND=Agg
              export PYTHONDONTWRITEBYTECODE=1
              python -I -c "import sys; from pathlib import Path; candidate=Path(sys.argv[1]).resolve(); tooling=Path(sys.argv[2]).resolve(); sys.path[:]=[str(candidate),*[entry for entry in sys.path if Path(entry or '.').resolve()!=tooling]]; import pytest; raise SystemExit(pytest.main(sys.argv[3:]))" \
                "$output/wheel-target" \
                "$GITHUB_WORKSPACE/tooling" \
                --import-mode=importlib \
                -c "$GITHUB_WORKSPACE/tooling/pyproject.toml" \
                -o addopts= \
                -p no:cacheprovider \
                -p no:rerunfailures \
                --tb=short \
                --maxfail=0 \
                -m "not integration_online and not benchmark" \
                --ignore "$GITHUB_WORKSPACE/tooling/tests/architecture" \
                --ignore "$GITHUB_WORKSPACE/tooling/tests/benchmarks" \
                --ignore "$GITHUB_WORKSPACE/tooling/tests/docs" \
                --ignore "$GITHUB_WORKSPACE/tooling/tests/packaging" \
                --ignore "$GITHUB_WORKSPACE/tooling/tests/quality" \
                "$GITHUB_WORKSPACE/tooling/tests"
              echo "diagnostic_pytest_exit_code=$?"
            fi
          } > "$diagnostic" 2>&1 || true

      - name: Upload R2 matrix-cell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-acceptance-matrix-cell-${{ matrix.os }}
          path: r2-matrix-cell/${{ matrix.os }}
          if-no-files-found: warn

  r2-acceptance-matrix-aggregate:
    if: github.event_name == 'workflow_dispatch'
    needs: [r2-acceptance-build, r2-acceptance-matrix-cell]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact R2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.r2-acceptance-build.outputs.candidate_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout frozen R2 acceptance tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Set up D0-frozen Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.8"

      - name: Download the immutable R2 distribution
        uses: actions/download-artifact@v4
        with:
          name: r2-acceptance-dist
          path: r2-acceptance-dist

      - name: Download all R2 matrix-cell evidence
        uses: actions/download-artifact@v4
        with:
          pattern: r2-acceptance-matrix-cell-*
          path: r2-matrix-evidence
          merge-multiple: false

      - name: Verify the immutable R2 distribution
        shell: python
        working-directory: r2-acceptance-dist
        run: |
          import hashlib
          from pathlib import Path

          manifest = Path("build-artifacts.sha256")
          expected = {}
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              expected[name.strip()] = digest
          artifacts = [*sorted(Path(".").glob("*.whl")), *sorted(Path(".").glob("*.tar.gz"))]
          if len(artifacts) != 2 or set(expected) != {path.name for path in artifacts}:
              raise SystemExit("the build artifact does not contain exactly one wheel and one sdist")
          for artifact in artifacts:
              if hashlib.sha256(artifact.read_bytes()).hexdigest() != expected[artifact.name]:
                  raise SystemExit(f"distribution digest mismatch: {artifact.name}")

      - name: Materialize the immutable D0 bundle
        shell: python
        env:
          D0_BUNDLE_URL: ${{ inputs.d0_bundle_url }}
          D0_BUNDLE_SHA256: ${{ inputs.d0_bundle_sha256 }}
        run: |
          import hashlib
          import os
          import string
          import urllib.request
          import zipfile
          from pathlib import Path

          expected = os.environ["D0_BUNDLE_SHA256"].lower()
          url = os.environ["D0_BUNDLE_URL"]
          if not url.startswith("https://"):
              raise SystemExit("D0 bundle URL must use HTTPS")
          if len(expected) != 64 or any(char not in string.hexdigits for char in expected):
              raise SystemExit("D0 bundle SHA256 must be a 64-character hexadecimal digest")
          archive = Path("r2-d0-bundle.zip").resolve()
          with urllib.request.urlopen(url, timeout=60) as response, archive.open("wb") as target:
              while chunk := response.read(1024 * 1024):
                  target.write(chunk)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("D0 bundle archive digest mismatch")
          destination = Path("r2-d0").resolve()
          destination.mkdir()
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  target = (destination / member.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"unsafe D0 archive member: {member.filename}")
              bundle.extractall(destination)
          if not (destination / "d0-bundle-manifest.json").is_file():
              raise SystemExit("D0 bundle root must contain d0-bundle-manifest.json")

      - name: Validate R2 build handoff sidecars
        shell: python
        env:
          BUILD_ARTIFACT_ID: ${{ needs.r2-acceptance-build.outputs.dist_artifact_id }}
          BUILD_MANIFEST_SHA256: ${{ needs.r2-acceptance-build.outputs.dist_manifest_sha256 }}
          CANDIDATE_SHA: ${{ needs.r2-acceptance-build.outputs.candidate_sha }}
          CANDIDATE_TREE: ${{ needs.r2-acceptance-build.outputs.candidate_tree }}
        run: |
          import json
          import os
          from pathlib import Path

          expected_os = {"linux", "macos", "windows"}
          records = {}
          for path in Path("r2-matrix-evidence").rglob("r2-build-handoff.json"):
              record = json.loads(path.read_text(encoding="utf-8"))
              operating_system = record.get("matrix_os")
              if operating_system in records:
                  raise SystemExit(f"duplicate matrix handoff: {operating_system}")
              records[operating_system] = record
          if set(records) != expected_os:
              raise SystemExit(f"matrix handoff set mismatch: {sorted(records)}")
          for operating_system, record in records.items():
              expected = {
                  "artifact_id": os.environ["BUILD_ARTIFACT_ID"],
                  "artifact_name": "r2-acceptance-dist",
                  "build_manifest_sha256": os.environ["BUILD_MANIFEST_SHA256"],
                  "candidate_commit": os.environ["CANDIDATE_SHA"],
                  "candidate_tree": os.environ["CANDIDATE_TREE"],
                  "matrix_os": operating_system,
                  "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              }
              if any(record.get(key) != value for key, value in expected.items()):
                  raise SystemExit(f"invalid matrix handoff: {operating_system}")

      - name: Run the frozen R2 matrix aggregate contract
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.r2-acceptance-build.outputs.candidate_sha }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          wheel=$(find "$GITHUB_WORKSPACE/r2-acceptance-dist" -maxdepth 1 -type f -name '*.whl' -print)
          test "$(printf '%s\n' "$wheel" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1
          python -I "$GITHUB_WORKSPACE/tooling/scripts/run_0042_r2_acceptance.py" \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --candidate-head "$CANDIDATE_SHA" \
            --candidate-wheel "$wheel" \
            --expected-bundle "$GITHUB_WORKSPACE/r2-d0" \
            --gate matrix-aggregate \
            --matrix-evidence-dir "$GITHUB_WORKSPACE/r2-matrix-evidence" \
            --require-os linux macos windows \
            --require-support-window-from-bundle \
            --output-dir "$GITHUB_WORKSPACE/r2-matrix-aggregate"

      - name: Upload R2 matrix aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-acceptance-matrix-aggregate
          path: r2-matrix-aggregate
          if-no-files-found: warn
