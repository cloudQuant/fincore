name: CI

on:
  push:
    branches: [master, main]
    tags: ["*"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform matrix: fast suite + serial suite, full failure evidence.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Run fast suite (parallel)
        run: |
          pytest tests/ -q --tb=short --maxfail=0 -m "not slow and not integration and not serial" --ignore=tests/benchmarks/ -n auto

      - name: Run serial suite
        run: |
          pytest tests/ -q --tb=short --maxfail=0 -m "serial and not slow and not integration" --ignore=tests/benchmarks/ -n 0

  # Comparable non-serial runs: single-process vs xdist, JUnit-verified.
  non-serial-single:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Run non-serial suite (single process)
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not serial and not slow and not integration" --ignore=tests/benchmarks \
            --junitxml=non-serial-single.xml

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-non-serial-single
          path: non-serial-single.xml

  non-serial-parallel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Run non-serial suite (xdist)
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not serial and not slow and not integration" --ignore=tests/benchmarks \
            --junitxml=non-serial-parallel.xml -n auto --dist=loadscope

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-non-serial-parallel
          path: non-serial-parallel.xml

  compare-nonserial:
    runs-on: ubuntu-latest
    needs: [non-serial-single, non-serial-parallel]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download JUnit reports
        uses: actions/download-artifact@v4
        with:
          path: junit-reports
          merge-multiple: true

      - name: Compare single-process and xdist JUnit reports
        run: |
          python scripts/audit_test_markers.py --compare-junit \
            junit-reports/non-serial-single.xml junit-reports/non-serial-parallel.xml

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Run compatibility manifest suite
        run: |
          pytest -o addopts='' tests/compat -q --tb=short --maxfail=0

  # Dedicated offline compatibility gate for the integrated Alphalens facade.
  compat-alphalens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,alphalens,pyfolio]"
          pip install -r requirements-test.txt

      - name: Run Alphalens compatibility suites
        env:
          MPLBACKEND: Agg
        run: >-
          python -m pytest -o addopts=''
          tests/compat/alphalens tests/test_factor_analysis
          -q --tb=short --maxfail=0

  integration-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Run offline integration suite
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 -m integration_offline

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check fincore/ tests/ scripts/ examples/ benchmarks/ --output-format=github

      - name: Ruff format (check)
        run: ruff format --check fincore/ tests/ scripts/ examples/ benchmarks/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: mypy (full package)
        run: |
          python -m mypy fincore --ignore-missing-imports

      - name: compileall (syntax check)
        run: |
          python -m compileall -q fincore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Bandit security scan
        run: bandit -r fincore/ -c pyproject.toml

  marker-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Audit release-gate markers
        run: python scripts/audit_test_markers.py

  # Branch-coverage gate: same selector as the trusted Task 1 baseline
  # (which includes serial tests in a single process) so the comparison is
  # apples-to-apples, plus a changed-line coverage floor of 95%.
  coverage-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,viz]"
          pip install -r requirements-test.txt

      - name: Run tests with branch coverage
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not slow and not integration" --ignore=tests/benchmarks \
            --cov=fincore --cov-branch --cov-report=json:coverage.json

      - name: Check coverage against baseline
        run: |
          python scripts/check_coverage_baseline.py \
            --coverage-json coverage.json \
            --baseline docs/quality/current-baseline.json \
            --changed-lines-min 95

      - name: Upload coverage JSON
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[viz]"
          pip install mkdocs-material "mkdocstrings[python]" mkdocs-gen-files mkdocs-literate-nav

      - name: Build docs (strict)
        run: python -m mkdocs build --strict

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      # The previous run's results act as the platform-labelled baseline
      # (cache keyed by runner OS/arch).  On a cold cache the comparison
      # still enforces the structural gates (superlinearity, window RSS
      # scaling, round-trip share-amount scaling).
      - name: Restore previous benchmark baseline
        uses: actions/cache@v4
        with:
          path: .benchmarks/
          key: perf-baseline-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            perf-baseline-${{ runner.os }}-${{ runner.arch }}
          save-always: true

      - name: Run rolling benchmarks
        run: |
          mkdir -p .benchmarks
          python scripts/run_rolling_benchmarks.py \
            --sizes 2520 25200 --windows 21 63 252 504 \
            --repeats 3 --output .benchmarks/rolling-candidate.json

      - name: Run round-trip benchmarks
        run: |
          python scripts/run_round_trip_benchmarks.py \
            --amounts 10 10000000 --rows 100 10000 \
            --repeats 3 --output .benchmarks/round-trips-candidate.json

      # Performance regressions fail CI; no continue-on-error.  A missing
      # baseline file only downgrades to the structural gates, which still
      # fail on complexity and memory-scaling regressions.
      - name: Compare rolling benchmarks against baseline
        run: |
          python scripts/compare_benchmarks.py \
            --baseline .benchmarks/rolling-baseline.json \
            --candidate .benchmarks/rolling-candidate.json \
            --max-time-regression 0.25 --max-rss-regression 0.25 \
            --allow-missing-baseline

      - name: Compare round-trip benchmarks against baseline
        run: |
          python scripts/compare_benchmarks.py \
            --baseline .benchmarks/round-trips-baseline.json \
            --candidate .benchmarks/round-trips-candidate.json \
            --max-time-regression 0.25 --max-rss-regression 0.25 \
            --allow-missing-baseline

      - name: Gate benchmark runner schemas
        run: |
          pytest -o addopts='' -q tests/benchmarks/test_rolling_regression.py \
            tests/benchmarks/test_round_trip_scaling.py

      - name: Store candidate as next baseline
        run: |
          cp .benchmarks/rolling-candidate.json .benchmarks/rolling-baseline.json
          cp .benchmarks/round-trips-candidate.json .benchmarks/round-trips-baseline.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: .benchmarks/

  # Deliberately separate from the fast/xdist test matrix: these real enhanced
  # factor-analysis artifacts measure process RSS in fresh subprocesses.
  factor-benchmark-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Gate factor benchmark contracts (single process)
        run: |
          python -m pytest -o addopts='' -q \
            tests/benchmarks/test_factor_analysis_performance.py

      - name: Run sparse event benchmark artifact
        run: |
          mkdir -p .factor-benchmarks
          python scripts/run_factor_benchmarks.py \
            --scenarios event --warmups 1 --repeats 1 \
            --output .factor-benchmarks/factor-event.json

      - name: Run medium factor benchmark artifact
        run: |
          python scripts/run_factor_benchmarks.py \
            --scenarios medium-artifact --warmups 0 --repeats 1 \
            --output .factor-benchmarks/factor-medium.json

      - name: Upload factor benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factor-benchmark-artifacts
          path: .factor-benchmarks/

  # Release build gate: depends on every blocking job, not only tests.
  build:
    runs-on: ubuntu-latest
    needs:
      [test, non-serial-single, non-serial-parallel, compare-nonserial, compat, compat-alphalens,
       integration-offline, lint, typecheck, security, marker-audit,
       coverage-branch, docs, perf, factor-benchmark-artifacts,
       quality-snapshot-freshness, optional-extra-smoke, property-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install build tools
        run: |
          pip install build twine pytest
          # Runtime deps for the packaging contract tests (they import the
          # checkout and run core-only consumer subprocesses).
          pip install -e .

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist
        run: twine check dist/*

      - name: Verify release consistency
        run: python scripts/check_release_consistency.py --dist dist/

      - name: Compute release manifest (SHA256)
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib
          artifacts = {}
          for p in pathlib.Path("dist").glob("*"):
              if p.is_file() and not p.name.endswith(".json"):
                  artifacts[p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          pathlib.Path("dist/release-manifest.json").write_text(
              json.dumps({"artifacts": artifacts}, indent=2)
          )
          EOF

      - name: Verify release candidate digest
        run: python scripts/check_release_candidate.py --dist dist/ --manifest dist/release-manifest.json

      # These are real candidate installs, not a check that two text files
      # contain plausible version strings.  The command logs the versions seen
      # inside each new venv, runs pip check, and imports the installed wheel.
      - name: Verify candidate with oldest-resolvable dependencies
        run: >-
          python scripts/check_dependency_matrix.py
          --wheel "$(find dist -name '*.whl' -print -quit)" --lane minimum

      - name: Verify candidate with newest dependency floors
        run: >-
          python scripts/check_dependency_matrix.py
          --wheel "$(find dist -name '*.whl' -print -quit)" --lane latest

      # Wheel-consumer smoke: pip --target installs the wheel (plus extras)
      # into isolated targets and fresh ``-S -E`` subprocesses assert package
      # provenance, star-import safety, and DependencyError gates.  The full
      # five required Task 9 profiles are the release gate; legacy dedicated
      # profiles remain available to the script but are not part of this job.
      # Playwright browser binaries + real PDF rendering are a separate
      # two-stage job.
      - name: Wheel consumer smoke (Task 9 required profiles)
        run: >-
          python scripts/test_installed_wheel.py --dist dist/
          --profiles core factor-analysis alphalens alphalens-pyfolio all

      - name: Packaging contract tests
        run: pytest -o addopts='' tests/packaging -q --maxfail=0

      # CI verifies that the distribution preserves the complete, pinned
      # third-party notice inventory. ``--require-approved`` remains an
      # optional organization-policy audit and is deliberately not a release
      # prerequisite: CI cannot manufacture a legal approval.
      - name: Check third-party notice inventory
        run: python scripts/check_notices.py

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Freshness gate for the checked-in quality snapshot.  A release claim can
  # only cite a snapshot that is clean (dirty=false), complete, and above the
  # branch-coverage minimum.  The commit-equality check is skipped here because
  # CI HEAD is the PR/release commit while the snapshot records the commit it
  # was generated from (always an ancestor); the local checker still enforces
  # exact HEAD equality at generation time.
  quality-snapshot-freshness:
    runs-on: ubuntu-latest
    needs: [coverage-branch]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check quality snapshot freshness
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            python scripts/check_quality_snapshot.py \
              --snapshot docs/quality/current-baseline.json
          else
            python scripts/check_quality_snapshot.py \
              --snapshot docs/quality/current-baseline.json \
              --skip-commit-check
          fi

  # Clean-environment smoke for the optional data extras.  Installs each extra,
  # imports its SDK in a fresh interpreter, and runs the fake-client provider
  # tests.  It never contacts a market-data service, so a broken native TLS
  # stack on a developer machine cannot block the release gate.
  optional-extra-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install data extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[data-yahoo,data-cn]"

      - name: Import SDKs in a fresh interpreter
        run: |
          python -c "import yfinance, akshare, tushare; print('data SDK import ok')"

      - name: Run fake-client provider tests
        run: |
          pytest -o addopts='' -q \
            tests/test_data/test_optional_dependency_health.py \
            tests/test_attribution/test_provider_contracts.py

  # Property tests run serially (-n 0) so Hypothesis shrinking and the global
  # seed stay reproducible; examples are bounded to keep CI time predictable.
  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install -r requirements-test.txt

      - name: Run property and oracle suites (serial)
        run: |
          pytest -o addopts='' tests/property -q --tb=short -n 0
