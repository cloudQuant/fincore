name: Deploy Docs

on:
  push:
    branches: [master]
    paths:
      - "mkdocs_docs/**"
      - "mkdocs.yml"
      - "fincore/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
  workflow_dispatch:

# GitHub Pages is configured with build_type "workflow"; the site artifact is
# produced and deployed by this workflow (no gh-pages branch push).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[viz]"
          pip install mkdocs-material "mkdocstrings[python]" mkdocs-gen-files mkdocs-literate-nav

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
