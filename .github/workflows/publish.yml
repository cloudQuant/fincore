name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Release gate: every blocking check (tests, lint, type, security,
  # coverage, docs, wheel consumers) must pass before the PyPI publish job
  # can run.  The verify job mirrors the release gates of ci.yml so a
  # release can never ship from a tree that failed any of them.
  verify:
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.candidate.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,visualization]"
          pip install -r requirements-test.txt
          pip install build twine mkdocs-material "mkdocstrings[python]" mkdocs-gen-files mkdocs-literate-nav

      - name: Lint
        run: |
          ruff check fincore/ tests/ scripts/ examples/ benchmarks/
          ruff format --check fincore/ tests/ scripts/ examples/ benchmarks/

      - name: Type check (full package)
        run: |
          python -m mypy fincore --ignore-missing-imports
          python -m compileall -q fincore

      - name: Security scan
        run: bandit -r fincore/ -c pyproject.toml

      - name: Marker audit
        run: python scripts/audit_test_markers.py

      - name: Fast suite
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not slow and not integration and not serial" --ignore=tests/benchmarks

      - name: Serial suite
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "serial and not slow and not integration" --ignore=tests/benchmarks

      - name: Non-serial single-process and xdist (comparable)
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not serial and not slow and not integration" --ignore=tests/benchmarks \
            --junitxml=nonserial-single.xml
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not serial and not slow and not integration" --ignore=tests/benchmarks \
            --junitxml=nonserial-parallel.xml -n auto --dist=loadscope
          python scripts/audit_test_markers.py --compare-junit nonserial-single.xml nonserial-parallel.xml

      - name: Offline integration suite
        run: pytest -o addopts='' tests/ -q --tb=short --maxfail=0 -m integration_offline

      - name: Branch coverage gate
        run: |
          pytest -o addopts='' tests/ -q --tb=short --maxfail=0 \
            -m "not slow and not integration" --ignore=tests/benchmarks \
            --cov=fincore --cov-branch --cov-report=json:coverage.json
          python scripts/check_coverage_baseline.py \
            --coverage-json coverage.json \
            --baseline docs/quality/current-baseline.json \
            --changed-lines-min 95

      - name: Docs build (strict)
        run: python -m mkdocs build --strict

      - name: Resolve and download the exact CI candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          release_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          ci_run_id="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
            --commit "${release_sha}" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "${ci_run_id}" || "${ci_run_id}" == "null" ]]; then
            echo "No successful CI candidate exists for ${RELEASE_TAG} (${release_sha})" >&2
            exit 1
          fi
          echo "ci_run_id=${ci_run_id}" >> "${GITHUB_OUTPUT}"
          gh run download "${ci_run_id}" --name dist --dir dist/ --repo "${{ github.repository }}"

      - name: Check dist
        run: twine check dist/*.whl dist/*.tar.gz

      - name: Verify candidate digest
        run: python scripts/check_release_candidate.py --dist dist/ --manifest dist/release-manifest.json

      - name: Verify release consistency
        run: python scripts/check_release_consistency.py --dist dist/

      - name: Wheel consumer smoke (Task 9 required profiles)
        run: >-
          python scripts/test_installed_wheel.py --dist dist/
          --profiles core factor-analysis visualization report-pdf report-xlsx bayesian all
          --data-providers all

      - name: Packaging contract tests
        run: pytest -o addopts='' tests/packaging -q --maxfail=0

      # Preserve and verify source/provenance evidence in the artifact. A
      # human approval can be audited with ``--require-approved`` outside this
      # pipeline, but it is not a condition for publishing this candidate.
      - name: Check third-party notice inventory
        run: python scripts/check_notices.py

  publish:
    runs-on: ubuntu-latest
    needs: [verify]
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Download verified CI candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.verify.outputs.ci_run_id }}" \
            --name dist --dir dist/ --repo "${{ github.repository }}"

      - name: Verify candidate digest
        run: python scripts/check_release_candidate.py --dist dist/ --manifest dist/release-manifest.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
        # Uses trusted publishing (OIDC) — no API token needed
        # Configure at: https://pypi.org/manage/project/fincore/settings/publishing/
        # Add GitHub Actions as a trusted publisher with:
        #   - Owner: cloudQuant
        #   - Repository: fincore
        #   - Workflow: publish.yml
        #   - Environment: pypi
