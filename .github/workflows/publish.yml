name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist
        run: |
          pip install "twine>=6.0"
          twine check dist/*

      # Release gates before publishing: version/tag/CHANGELOG/metadata
      # agreement, the full installed-wheel consumer matrix, and the
      # packaging contract tests.
      - name: Verify release consistency
        run: python scripts/check_release_consistency.py --dist dist/

      - name: Wheel consumer smoke (full profile matrix)
        run: python scripts/test_installed_wheel.py --dist dist/ --profiles core pyfolio interactive bayesian report-pdf all

      - name: Packaging contract tests
        run: |
          pip install pytest
          pytest -o addopts='' tests/packaging -q --maxfail=0

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing (OIDC) — no API token needed
        # Configure at: https://pypi.org/manage/project/fincore/settings/publishing/
        # Add GitHub Actions as a trusted publisher with:
        #   - Owner: cloudQuant
        #   - Repository: fincore
        #   - Workflow: publish.yml
        #   - Environment: pypi
