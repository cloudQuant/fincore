name: Feature request（功能建议）
description: 提出新指标、新后端或工作流改进建议
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。描述**要解决的问题**比描述具体实现更有帮助。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题（Problem）
      description: 你或你的用户遇到了什么困难？现有 API 为什么不够？
    validations:
      required: true

  - type: dropdown
    id: surface_impact
    attributes:
      label: 影响的 API 表面
      options:
        - "fincore.metrics / flat API（增强语义）"
        - "fincore.empyrical（严格兼容表面——注意该表面被冻结，新增能力一般不进入）"
        - "fincore.pyfolio"
        - "可视化 viz 后端"
        - "组合优化 / 蒙特卡洛 / 归因 / 风险"
        - "数据源 extras"
        - "文档 / 开发者体验"
        - "其他"
    validations:
      required: true

  - type: checkboxes
    id: extras
    attributes:
      label: 涉及的可选依赖（extras）
      description: 多选
      options:
        - label: core（无额外依赖）
        - label: pyfolio
        - label: alphalens / factor-analysis
        - label: interactive (plotly/bokeh)
        - label: report-pdf / report-xlsx
        - label: bayesian
        - label: data-* 数据源
        - label: 不涉及 extras

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（Alternatives）
      description: 你目前如何绕过？其他库是否已解决？

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
      description: 期望的 API 形状示例（伪代码即可）

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我理解严格兼容表面（empyrical/pyfolio façade）受冻结清单约束，语义分歧需走 ADR 流程
